<style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17253d;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:24px 12px}.shell{max-width:1220px;margin:auto}.panel{background:white;border:1px solid #e4e9f2;border-radius:18px;padding:28px;box-shadow:0 5px 20px #1122380a}h1{font-size:clamp(23px,4vw,34px);margin:0 0 12px}h2{font-size:22px;line-height:1.45}.muted{color:#58677e}.bar{height:9px;background:#e7ecf4;border-radius:20px;overflow:hidden;margin:18px 0}.fill{background:#3970d5;height:100%;width:0;transition:width .2s}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.timer{font-variant-numeric:tabular-nums;font-size:23px;font-weight:750}.timer.warn{color:#b42318}.option{display:block;width:100%;text-align:left;background:#fff;color:#182a46;border:1.5px solid #d7e0ed;border-radius:12px;padding:15px 18px;margin:10px 0;cursor:pointer;font:inherit;line-height:1.45}.option:hover,.option.selected{border-color:#3970d5;background:#edf4ff}.option:disabled{cursor:default}.primary{border:0;border-radius:11px;padding:13px 23px;font:inherit;font-weight:700;background:#245fd1;color:white;cursor:pointer}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#eef3fb;color:#204b8d}button:focus-visible{outline:3px solid #9fbdf6;outline-offset:2px}.flex{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.review{border-top:1px solid #e2e8f0;padding:17px 0;line-height:1.6}.good{color:#167044}.bad{color:#b42318}.pill{background:#eaf1ff;border-radius:30px;padding:5px 11px;color:#2454a7;font-size:14px}.hidden{display:none}.small{font-size:14px}select{font:inherit;padding:8px;border:1px solid #cbd5e1;border-radius:8px}.stats{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.stat{padding:7px 11px;background:#f0f5fb;border-radius:9px;font-size:14px}.navgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin:12px 0 22px}.navnum{border:1px <script>const BANK=[{"q": "Thuật ngữ khoa học “kinh tế chính trị” được sử dụng lần đầu tiên vào đầu thế kỷ thứ:", "a": ["XV", "XVI", "XVII", "XVIII"], "key": 2}, {"q": "Người đầu tiên đưa ra khái niệm \"kinh tế chính trị\" là:", "a": ["Tomas Mun", "William Petty", "Francois Quesney", "Antoine Montchretien"], "key": 3}, {"q": "Antoine Montchretien là nhà kinh tế người nước:", "a": ["Pháp", "Bỉ", "Anh", "Hà Lan"], "key": 0}, {"q": "Antoine Montchretien là nhà kinh tế thuộc trường phái:", "a": ["Trọng thương Pháp", "Trọng nông Pháp", "Kinh tế chính trị tư sản cổ điển", "Kinh tế chính trị tầm thường"], "key": 0}, {"q": "A.Smith là nhà kinh tế học người nước:", "a": ["Anh", "Pháp", "Tây Ban Nha", "Hà Lan"], "key": 0}, {"q": "Chủ nghĩa trọng thương nhấn mạnh vai trò của:", "a": ["Hoạt động ngoại thương", "Sản xuất nông nghiệp", "Sản xuất công nghiệp", "Sản xuất tiểu thủ công nghiệp"], "key": 0}, {"q": "Chủ nghĩa trọng nông nhấn mạnh vai trò của:", "a": ["Hoạt động ngoại thương", "Sản xuất nông nghiệp", "Sản xuất công nghiệp", "Sản xuất tiểu thủ công nghiệp"], "key": 1}, {"q": "Kinh tế- chính trị Mác - Lênin đã kế thừa và phát triển trực tiếp những thành tựu của:", "a": ["Chủ nghĩa trọng thương", "Kinh tế chính trị cổ điển Anh", "Kinh tế- chính trị tầm thường", "Chủ nghĩa trọng nông"], "key": 1}, {"q": "Phương pháp quan trọng nhất để nghiên cứu kinh tế - chính trị Mác - Lênin là:", "a": ["Trừu tượng hoá khoa học", "Phân tích và tổng hợp", "Mô hình hoá", "Điều tra thống kê"], "key": 0}, {"q": "Chủ nghĩa trọng thương tồn tại:", "a": ["Từ thế kỷ thứ X đến thế kỷ XV", "Từ thế kỷ thứ XV đến cuối thế kỷ XVII", "Từ giữa thế kỷ thứ XVII đến nửa đầu thế kỷ XVIII", "Từ giữa thế kỷ XVII đến cuối thế kỷ XVIII"], "key": 1}, {"q": "Chủ nghĩa trọng nông tồn tại:", "a": ["Từ thế kỷ thứ X đến thế kỷ XV", "Từ thế kỷ thứ XV đến cuối thế kỷ XVII", "Từ giữa thế kỷ thứ XVII đến nửa đầu thế kỷ XVIII", "Từ giữa thế kỷ XVII đến cuối thế kỷ XVIII"], "key": 2}, {"q": "Kinh tế chính trị tư sản cổ điển Anh tồn tại:", "a": ["Từ thế kỷ thứ X đến thế kỷ XV", "Từ thế kỷ thứ XV đến cuối thế kỷ XVII", "Từ giữa thế kỷ thứ XVII đến nửa đầu thế kỷ XVIII", "Từ giữa thế kỷ XVII đến cuối thế kỷ XVIII"], "key": 3}, {"q": "Người sáng lập ra chủ nghĩa Mác là:", "a": ["Các Mác", "C.Mác và Ph.Ăng ghen", "C.Mác và V.I. Lênin", "C.Mác, Ph. Ăng ghen và V.I. Lênin"], "key": 1}, {"q": "Người sáng lập ra chủ nghĩa Mác – Lênin là:", "a": ["Các Mác", "C.Mác và Ph.Ăng ghen", "C.Mác và V.I. Lênin", "C.Mác, Ph. Ăng ghen và V.I. Lênin"], "key": 3}, {"q": "Học thuyết kinh tế của C.Mác được coi là hòn đá tảng là:", "a": ["Học thuyết giá trị lao động", "Học thuyết giá trị thặng dư", "Học thuyết tích luỹ tư sản", "Học thuyết tái sản xuất tư bản"], "key": 1}, {"q": "Học thuyết kinh tế tiền đề để C.Mác xây dựng lên học thuyết giá trị thặng dư là:", "a": ["Học thuyết giá trị", "Học thuyết về tiền lương", "Học thuyết tích luỹ tư sản", "Học thuyết tái sản xuất tư bản"], "key": 0}, {"q": "Mục đích nghiên cứu của kinh tế chính trị Mác – Lênin là:", "a": ["Nhằm phát hiện ra các quy luật kinh tế chi phối các quan hệ giữa người với người trong sản xuất và trao đổi", "Nhằm phát hiện ra các quy luật kinh tế chi phối các quan hệ giữa người với người", "Nhằm phát hiện ra các quy luật kinh tế chi phối các quan hệ giữa người với người trong sản xuất", "Nhằm phát hiện ra các quy luật kinh tế chi phối các quan hệ giữa người với người trong trao đổi"], "key": 0}, {"q": "Quy luật kinh tế là:", "a": ["Những mối liên hệ phản ánh bản chất, khách quan, lặp đi lặp lại của các hiện tượng và quá trình kinh tế", "Những mỗi liên hệ phản ánh bản chất, chủ quan, lặp đi lặp lại của các hiện tượng và quá trình kinh tế", "Những sự phản ánh bản chất, chủ quan, lặp đi lặp lại của các hiện tượng kinh tế", "Những mỗi liên hệ phản ánh chủ quan, lặp đi lặp lại của các hiện tượng và quá trình kinh tế"], "key": 0}, {"q": "Khi nghiên cứu phương thức sản xuất chủ nghĩa tư bản, C.Mác bắt đầu từ:", "a": ["Sản xuất giá trị thặng dư", "Sản xuất của cải vật chất", "Lưu thông hàng hoá", "Sản xuất hàng hoá giản đơn và hàng hóa"], "key": 3}, {"q": "Trường phái được ghi nhận là hệ thống lý luận kinh tế chính trị đầu tiên nghiên cứu về nền sản xuất tư bản chủ nghĩa là:", "a": ["Chủ nghĩa trọng thương", "Chủ nghĩa trọng nông", "Kinh tế chính trị tư sản cổ điển Anh", "Kinh tế chính trị tiểu tư sản"], "key": 0}, {"q": "Người được C. Mác coi là sáng lập ra kinh tế chính trị tư sản cổ điển là:", "a": ["A.Smith", "D.Ricardo", "W.Petty", "R.T.Mathus"], "key": 1}, {"q": "Người được coi là nhà kinh tế thời kỳ công trường thủ công là:", "a": ["W. Petty", "A. Smith", "D.Ricardo", "R.T.Mathus"], "key": 1}, {"q": "D.Ricardo là nhà kinh tế của:", "a": ["Thời kỳ tích luỹ nguyên thuỷ tư bản chủ nghĩa", "Thời kỳ công trường thủ công", "Thời kỳ đại công nghiệp cơ khí", "Thời kỳ hiệp tác giản đơn"], "key": 2}, {"q": "C.Mác nghiên cứu các vấn đề kinh tế chính trị để viết bộ “Tư bản” trong thời kỳ:", "a": ["Tích lũy nguyên thủy tư bản", "Chủ nghĩa tư bản tự do cạnh tranh", "Chủ nghĩa tư bản độc quyền", "Chủ nghĩa đế quốc"], "key": 1}, {"q": "Đối tượng nghiên cứu của kinh tế - chính trị Mác - Lênin là:", "a": ["Sản xuất của cải vật chất", "Quan hệ xã hội giữa người với người đặt trong sự liên hệ biện chứng với trình độ phát triển của lực lượng sản xuất và kiến trúc thượng tầng tương ứng", "Quan hệ xã hội của sản xuất và trao đổi đặt trong sự liên hệ biện chứng với trình độ phát triển của lực lượng sản xuất và kiến trúc thượng tầng tương ứng", "Quá trình sản xuất, phân phối, trao đổi, tiêu dùng."], "key": 2}, {"q": "Mặt tự nhiên của phương thức sản xuất là:", "a": ["Quan hệ sản xuất", "Cơ sở hạ tầng", "Kiến trúc thượng tầng", "Lực lượng sản xuất"], "key": 3}, {"q": "Mặt xã hội của phương thức sản xuất là:", "a": ["Quan hệ sản xuất", "Cơ sở hạ tầng", "Kiến trúc thượng tầng", "Lực lượng sản xuất"], "key": 0}, {"q": "\"Những thời đại kinh tế khác nhau không phải ở chỗ chúng sản xuất ra cái gì, mà là ở chỗ chúng sản xuất bằng cách nào, với những tư liệu lao động nào\". Câu nói trên là của:", "a": ["A. Smith", "D.Ricardo", "C.Mác", "Ph.Ăng ghen"], "key": 1}, {"q": "Hoạt động của con người được coi là cơ bản nhất và là cơ sở của đời sống xã hội:", "a": ["Hoạt động chính trị", "Hoạt động sản xuất của cải vật chất", "Hoạt động khoa học", "Hoạt động nghệ thuật, thể thao THAM GIA THỊ TRƯỜNG"], "key": 1}, {"q": "Sản xuất hàng hóa là:", "a": ["Kiểu tổ chức sản xuất mà ở đó sản phẩm được sản xuất ra nhằm mục đích trao đổi, mua bán", "Kiểu tổ chức sản xuất mà ở đó sản phầm được sản xuất ra nhằm thỏa mãn nhu cầu của bản thân người sản xuất", "Kiểu tổ chức sản xuất mà ở đó sản phẩm được sản xuất ra nhằm thỏa mãn nhu cầu mang tính nội bộ", "Kiểu tổ chức sản xuất mà ở đó sản phẩm được sản xuất ra nhằm thỏa mãn nhu cầu của con cái người sản xuất"], "key": 0}, {"q": "Sản xuất hàng hóa xuất hiện vào:", "a": ["Giai đoạn đầu của phương thức sản xuất tư bản chủ nghĩa", "Thời kỳ tan rã của phương thức sản xuất phong kiến", "Thời kỳ tan rã của phương thức sản xuất chiếm hữu nô lệ", "Thời kỳ tan rã của phương thức sản xuất công xã nguyên thủy"], "key": 3}, {"q": "Sản xuất hàng hóa tồn tại:", "a": ["Trong mọi thời đại", "Dưới chế độ: Công xã nguyên thủy, chiếm hữu nô lệ, phong kiến, tư bản chủ nghĩa và cộng sản chủ nghĩa", "Chỉ có trong chủ nghĩa tư bản", "Trong các xã hội có phân công lao động xã hội và sự tách biệt về mặt kinh tế của các chủ thể sản xuất"], "key": 3}, {"q": "Sản xuất hàng hoá xuất hiện dựa trên:", "a": ["Phân công lao động cá biệt và chế độ tư hữu về tư liệu sản xuất", "Phân công lao động chung và chế độ sở hữu khác nhau về tư liệu sản xuất", "Phân công lao động và sự tách biệt về kinh tế giữa những người sản xuất", "Phân công lao động xã hội và chế độ tư hữu hoặc những hình thức sở hữu khác nhau về tư liệu sản xuất"], "key": 2}, {"q": "Điều kiện ra đời và tồn tại của sản xuất hàng hóa là:", "a": ["Có sự phân công lao động xã hội", "Có sự tách biệt tương đối về kinh tế giữa những người sản xuất", "Con người biết sáng tạo ra công cụ lao động", "Có sự phân công lao động xã hội và có sự tách biệt tương đối về mặt kinh tế của các chủ thể sản xuất"], "key": 3}, {"q": "Phân công lao động xã hội là:", "a": ["Sự phân chia lao động xã hội thành các ngành, nghề khác nhau", "Sự phân chia lao động trong một đơn vị sản xuất", "Sự phân chia các công đoạn trong một dây chuyền sản xuất", "Sự phân chia lao động thành các khâu khác nhau"], "key": 0}, {"q": "Hàng hóa là:", "a": ["Sản phẩm do con người tạo ra để thỏa mãn nhu cầu của bản thân", "Sản phẩm lao động nói chung của con người", "Sản phẩm của lao động, thỏa mãn nhu cầu của con người thông qua trao đổi, mua bán", "Tặng vật của tự nhiên"], "key": 2}, {"q": "Một sản phẩm chỉ là hàng hóa khi thỏa mãn các tiêu chí:", "a": ["Là sản phẩm của lao động", "Thỏa mãn nhu cầu nào đó của con người", "Đi vào tiêu dùng thông qua trao đổi, mua bán", "Là sản phẩm của lao động, thỏa mãn nhu cầu nào đó của con người, đi vào tiêu dùng thông qua trao đổi, mua bán"], "key": 3}, {"q": "Giá trị sử dụng của hàng hóa là:", "a": ["Giá trị trao đổi giữa các hàng hóa", "Công dụng của hàng hóa nhằm thỏa mãn nhu cầu của con người", "Giá trị bằng tiền của hàng hóa", "Hao phí lao động của con người kết tinh trong hàng hóa"], "key": 1}, {"q": "Giá trị của hàng hóa là:", "a": ["Hao phí lao động nói chung của con người", "Hao phí lao động cá biệt của người sản xuất hàng hóa kết tinh trong hàng hóa", "Lao động xã hội của người sản xuất đã hao phí để sản xuất ra hàng hóa kết tinh trong hàng hóa ấy", "Giá trị bằng tiền của hàng hóa đó"], "key": 2}, {"q": "Giá trị của hàng hoá được quyết định bởi:", "a": ["Sự khan hiếm của hàng hoá", "Lao động cụ thể của người sản xuất hàng hóa kết tinh trong hàng hóa", "Lao động trừu tượng của người sản xuất kết tinh trong hàng hoá", "Công dụng của hàng hoá"], "key": 2}, {"q": "Đặc điểm giá trị sử dụng của hàng hóa:", "a": ["Là một phạm trù vĩnh viễn", "Là một phạm trù lịch sử", "Không do thuộc tính tự nhiên của vật thể hàng hóa quyết định", "Không phải là vật mang gia trị trao đổi"], "key": 0}, {"q": "Lao động cụ thể là:", "a": ["Những việc làm cụ thể", "Lao động có mục đích cụ thể", "Lao động ở các ngành nghề cụ thể", "Lao động có ích dưới một hình thức cụ thể của những nghề nghiệp chuyên môn nhất định"], "key": 3}, {"q": "Lao động trừu tượng là:", "a": ["Lao động không cụ thể", "Lao động phức tạp", "Lao động có trình độ cao, mất nhiều công đào tạo", "Lao động xã hội của người sản xuất hàng hóa không kể đến hình thức cụ thể của nó; đó là sự hao phí sức lao động nói chung của người sản xuất hàng hóa về cơ bắp, thần kinh, trí óc."], "key": 3}, {"q": "Ý kiến đúng về phạm trù lao động trừu tượng là:", "a": ["Lao động không cụ thể", "Sự hao phí sức lao động của người sản xuất hàng hoá nói chung không kể đến các hình thức cụ thể.", "Lao động có trình độ cao, mất nhiều công đào tạo", "Lao động giản đơn"], "key": 1}, {"q": "Tính hai mặt của lao động sản xuất hàng hóa phản ánh:", "a": ["Quan hệ cung cầu của hàng hóa", "Tính chất tư nhân và tính chất xã hội của người sản xuất hàng hóa", "Giá cả thị trường của hàng hóa", "Lao động của người sản xuất hàng hóa"], "key": 1}, {"q": "Thước đo lượng giá trị hàng hóa được tính bằng:", "a": ["Số lượng giá trị sử dụng của hàng hóa", "Thời gian lao động cá biệt của từng người sản xuất hàng hóa", "Thời gian lao động xã hội cần thiết để sản xuất ra hàng hóa", "Thời gian lao động để sản xuất ra hàng hóa"], "key": 2}, {"q": "Lượng giá trị xã hội của hàng hoá được quyết định bởi:", "a": ["Hao phí vật tư kỹ thuật", "Hao phí lao động cần thiết của người sản xuất hàng hoá", "Hao phí lao động sống của người sản xuất hàng hoá", "Thời gian lao động xã hội cần thiết"], "key": 3}, {"q": "Lượng giá trị của đơn vị hàng hoá:", "a": ["Tỷ lệ thuận với năng suất lao động", "Tỷ lệ nghịch với cường độ lao động", "Tỷ lệ nghịch với năng suất lao động", "Tỷ lệ nghịch với thời gian lao động xã hội cần thiết và năng suất lao động"], "key": 2}, {"q": "Lượng giá trị của đơn vị hàng hoá:", "a": ["Tỷ lệ thuận với cường độ lao động", "Tỷ lệ nghịch với cường độ lao động", "Không phụ thuộc vào cường độ lao động", "Tỷ lệ thuận với năng suất lao động"], "key": 2}, {"q": "Cường độ lao động tăng lên thì:", "a": ["Số lượng hàng hoá làm ra trong một đơn vị thời gian tăng lên, lượng giá trị của 1 đơn vị hàng hóa không đổi", "Số lượng lao động hao phí trong thời gian đó không thay đổi", "Giá trị của 1 đơn vị hàng hoá giảm đi", "Giá trị của 1 đơn vị hàng hóa tăng lên"], "key": 0}, {"q": "Tăng cường độ lao động thì:", "a": ["Tổng giá trị hàng hoá tăng lên và giá trị 1 đơn vị hàng hoá cũng tăng lên tương ứng", "Giá trị 1 đơn vị hàng hoá tỷ lệ thuận với cường độ lao động", "Lượng giá trị của 1 đơn vị hàng hoá không đổi", "Giá trị của 1 đơn vị hàng hoá giảm đi"], "key": 2}, {"q": "Lao động giản đơn là:", "a": ["Lao động làm công việc đơn giản", "Lao động làm ra các hàng hoá chất lượng không cao", "Lao động chỉ làm một công đoạn của quá trình tạo ra hàng hoá", "Lao động không cần trải qua đào tạo cũng có thể làm được"], "key": 3}, {"q": "Lao động phức tạp là:", "a": ["Lao động tạo ra các sản phẩm chất lượng cao, tinh vi", "Lao động có nhiều thao tác phức tạp", "Lao động phải trải qua đào tạo, huấn luyện mới làm được", "Sự kết hợp nhiều lao động giản đơn với nhau"], "key": 2}, {"q": "Hình thái thấp nhất của giá trị hàng hóa là:", "a": ["Hình thái giá trị giản đơn", "Hình thái giá trị mở rộng", "Hình thái giá trị chung", "Hình thái tiền tệ"], "key": 0}, {"q": "Hình thái cao nhất của giá trị hàng hóa là:", "a": ["Hình thái giá trị giản đơn", "Hình thái giá trị mở rộng", "Hình thái giá trị chung", "Hình thái tiền tệ"], "key": 3}, {"q": "Bản chất của tiền tệ:", "a": ["Tiền tệ là tiền do nhà nước phát hành, vàng, ngoại tệ", "Là phương tiện để trao đổi hàng hoá và để thanh toán", "Là hàng hoá đặc biệt được tách ra làm vật ngang giá chung thống nhất cho các hàng hóa khác, nó thể hiện lao động xã hội và biểu hiện quan hệ giữa những người sản xuất hàng hóa", "Là thước đo gi n xuất với quan hệ chiếm hữu tư nhân tư bản chủ nghĩa về tư liệu sản xuất trong xã hội tư bản là:", "a": ["Mâu thuẫn giữa giai cấp công nhân và giai cấp tư sản", "Mâu thuẫn giữa các nhà tư bản với nhau", "Mâu thuẫn giữa giai cấp tư sản với giai cấp nông dân", "Mâu thuẫn giữa các nhà tư bản độc quyền"], "key": 0}, {"q": "Giá cả sản xuất bao gồm:", "a": ["Chí phí sản xuất + lợi nhuận", "Chi phí sản xuất + lợi nhuận bình quân", "Chi phí sản xuất + giá trị thặng dư", "Chi phí sản xuất + lợi nhuận siêu ngạch"], "key": 1}, {"q": "Bản chất lợi nhuận và giá trị thặng dư đều là:", "a": ["Lao động cụ thể của công nhân.", "Lao động không công của công nhân.", "Lao động trừu tượng của công nhân", "Lao động phức tạp của công nhân. •"], "key": 1}, {"q": "•   Lượng của lợi nhuận có thể:", "a": ["Bằng, hoặc thấp hơn lượng giá trị thặng dư.", "Bằng, cao hơn hoặc thấp hơn lượng giá trị thặng dư.", "Bằng, hoặc cao hơn lượng giá trị thặng dư.", "Cao hơn hoặc thấp hơn lượng giá trị thặng dư •"], "key": 1}, {"q": "•   Lượng tỷ suất lợi nhuận:", "a": ["Luôn luôn nhỏ hơn giá trị thặng dư.", "Luôn luôn lớn hơn tỷ suất giá trị thặng dư.", "Luôn luôn bằng tỷ suất giá trị thặng dư.", "Luôn luôn nhỏ hơn tỷ suất giá trị thặng dư. •"], "key": 3}, {"q": "•   Những nhân tố ảnh hưởng đến tỷ suất lợi nhuận bao gồm:", "a": ["Tỷ suất giá trị thặng dư; tốc độ chu chuyển của tư bản; tiết kiệm tư bản bất biến.", "Cấu tạo hữu cơ của tư bản; tốc độ chu chuyển của tư bản; tiết kiệm tư bản bất biến.", "Tỷ suất giá trị thặng dư; cấu tạo hữu cơ của tư bản; tốc độ chu chuyển của tư bản; tiết kiệm tư bản bất biến.", "Tỷ suất giá trị thặng dư; cấu tạo hữu cơ của tư bản; tốc độ chu chuyển của tư bản; tiết kiệm giá trị thặng dư."], "key": 2}, {"q": "Tỷ suất lợi nhuận giảm xuống trong trường hợp:", "a": ["Tỷ suất giá trị thặng dư tăng lên", "Cấu tạo hữu cơ của tư bản tăng lên", "Tốc độ chu chuyển của tư bản tăng lên", "Tăng tiết kiệm tư bản bất biến"], "key": 3}, {"q": "Cơ sở của sự hình thành tỷ suất lợi nhuận bình Tư bản hàng hóa mà người chủ của nó nhường cho người khác sử dụng trong một thời gian nhất định để thu lợi tức.", "Tư bản tiền tệ tạm thời nhàn rỗi mà người chủ sở hữu nó cho người khác sử dụng trong một thời gian nhất định để thu lợi tức.", "Tư bản tiền tệ mà người chủ của nó nhường cho người khác sử dụng trong một thời gian nhất định để thu lợi nhuận.", "Tư bản sản xuất mà người chủ của nó nhường cho người khác sử dụng trong một thời gian nhất định để thu lợi tức. •"], "key": 1}, {"q": "•     Địa tô tư bản là:", "a": ["Phần lợi nhuận ngoài lợi nhuận bình quân mà nhà tư bản kinh doanh nông nghiệp phải nộp cho chủ đất.", "Phần tỷ suất giá trị thặng dư ngoài lợi nhuận bình quân mà nhà tư bản kinh doanh nông nghiệp phải nộp cho chủ đất.", "Phần giá trị thặng dư ngoài lợi nhuận bình quân mà nhà tư bản kinh doanh nông nghiệp phải nộp cho chủ đất.", "Phần giá trị thặng dư ngoài lợi nhuận mà nhà tư bản kinh doanh nông nghiêp phải nộp cho chủ đất."], "key": 0}, {"q": "Giá cả thị trường của hàng hoá xoay quanh:", "a": ["Giá trị thị trường", "Giá trị của hàng hoá", "Giá cả sản xuất", "Quan hệ cung cầu hàng hoá TRƯỜNG"], "key": 0}, {"q": "Nguyên nhân ra đời của chủ nghĩa tư bản độc quyền là:", "a": ["Do cuộc đấu tranh của giai cấp công nhân và nhân dân lao động", "Do sự can thiệp của nhà nước tư sản", "Do sự tập trung sản xuất dưới tác động của cách mạng - khoa học - công nghệ", "Do cuộc đấu tranh của giai cấp công nhân và nhân dân lao động, do sự can thiệp của nhà nước tư sản và do sự tập trung sản xuất dưới tác động của cách mạng - khoa học - công nghệ"], "key": 3}, {"q": "Nhận định sai về mối quan hệ giữa độc quyền và cạnh tranh đó là:", "a": ["Độc quyền sinh ra từ cạnh tranh tự do", "Độc quyền thủ tiêu cạnh tranh tự do", "Độc quyền làm cho cạnh tranh trở nên đa dạng hơn", "Độc quyền không thủ tiêu cạnh tranh tự do"], "key": 1}, {"q": "Tổ chức độc quyền ra đời trên cơ sở:", "a": ["Sự liên minh của tất cả các nhà tư bản hoạt động trong cùng 1 ngành", "Sự liên minh giữa các function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sample(n){let inds=Array.from({length:BANK.length},(_,i)=>i);for(let i=inds.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[inds[i],inds[j]]=[inds[j],inds[i]];}return inds.slice(0,n).map(i=>({q:BANK[i].q,original:i,a:BANK[i].a,key:BANK[i].key}));}
const DURATION=40*60;
let remainingSeconds=DURATION,deadline=0;
function formatTime(seconds){const t=Math.max(0,seconds);return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;}
function refreshTime(){if(done)return;remainingSeconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));const clock=document.getElementById('clock');if(clock){clock.textContent=formatTime(remainingSeconds);clock.classList.toggle('warn',remainingSeconds<=300);}if(remainingSeconds===0)finish(true);}
function start(){clearInterval(interval);test=sample(50);answers=Array(50).fill(null);pos=0;done=false;remainingSeconds=DURATION;deadline=Date.now()+DURATION*1000;question();interval=setInterval(refreshTime,250);}
function home(){clearInterval(interval);done=true;app.innerHTML=`<h1>Ôn tập Kinh tế chính trị</h1><p class="muted">Ngân hàng <strong>${BANK.length} câu</strong> từ tài liệu PDF, kèm đáp án. Mỗi lượt rút ngẫu nhiên <strong>50 câu không trùng nhau</strong>.</p><p>⏱️ <strong>40 phút cho toàn bộ bài thi</strong> • Không giới hạn thời gian từng câu • Tự do chuyển câu và sửa đáp án đã chọn • Tự nộp bài khi hết giờ.</p><p class="muted small">Chạy offline trên trình duyệt, không cần tài khoản. Không đóng hoặc tải lại trang khi đang làm bài vì tiến độ không được lưu.</p><button class="primary" onclick="start()">Bắt đầu 50 câu ngẫu nhiên</button>`;}
function updateNavigation(){const completed=answers.filter(a=>a!==null).length;const countAnswered=document.getElementById('countAnswered'),countUnanswered=document.getElementById('countUnanswered');if(countAnswered)countAnswered.textContent=completed;if(countUnanswered)countUnanswered.textContent=test.length-completed;const fill=document.querySelector('.fill');if(fill)fill.style.width=`${completed/test.length*100}%`;document.querySelectorAll('.navnum').forEach((b,i)=>{b.classList.toggle('answered',answers[i]!==null);b.classList.toggle('current',i===pos);b.setAttribute('aria-current',i===pos?'step':'false');b.title=`Câu ${i+1}: ${answers[i]!==null?'đã trả lời':'chưa trả lời'}${i===pos?', đang xem':''}`;});}
function question(){if(done)return;const q=test[pos],completed=answers.filter(a=>a!==null).length;app.innerHTML=`<div class="top"><span class="pill">Câu ${pos+1} / ${test.length}</span><span class="timer ${remainingSeconds<=300?'warn':''}" id="clock" aria-label="Thời gian còn lại">${formatTime(remainingSeconds)}</span></div><p class="muted small" style="margin:7px 0">Thời gian còn lại cho toàn bài thi (40 phút)</p><div class="bar"><div class="fill" style="width:${completed/test.length*100}%"></div></div><div class="stats"><span class="stat">Tổng: <b>${test.length}</b> câu</span><span class="stat">Đã trả lời: <b id="countAnswered">${completed}</b></span><span class="stat">Chưa trả lời: <b id="countUnanswered">${test.length-completed}</b></span></div><div class="exam-layout"><section class="question-nav" aria-label="Danh sách câu hỏi"><h3>Danh sách 50 câu hỏi — nhấn số để chuyển</h3><div class="navgrid">${test.map((_,i)=>`<button type="button" class="navnum ${i===pos?'current':''} ${answers[i]!==null?'answered':''}" onclick="go(${i})" aria-label="Câu ${i+1}" title="Câu ${i+1}">${i+1}</button>`).join('')}</div><div class="legend"><span><i class="dot now"></i>Câu hiện tại (viền xanh)</span><span><i class="dot done"></i>Đã trả lời (nền xanh lá)</span><span><i class="dot"></i>Chưa trả lời (nền trắng)</span></div></section><div class="question-content"><h2>Câu ${pos+1}. ${escapeHtml(q.q)}</h2><div id="choices">${q.a.map((v,i)=>`<button class="option ${answers[pos]===i?'selected':''}" onclick="choose(${i})" aria-pressed="${answers[pos]===i}"><strong>${'ABCD'[i]}.</strong> ${escapeHtml(v)}</button>`).join('')}</div><p class="note">Bạn có thể thay đổi lựa chọn bất cứ lúc nào trước khi nộp bài hoặc hết 40 phút.</p><div class="actions"><button class="primary secondary" onclick="go(${pos-1})" ${pos===0?'disabled':''}>← Câu trước</button><button class="primary secondary" onclick="go(${pos+1})" ${pos===test.length-1?'disabled':''}>Câu tiếp →</button><button class="primary" onclick="submitQuiz()">Nộp bài</button></div></div></div>`;updateNavigation();}
function choose(i){if(done)return;answers[pos]=i;document.querySelectorAll('.option').forEach((el,k)=>{el.classList.toggle('selected',k===i);el.setAttribute('aria-pressed',String(k===i));});updateNavigation();}
function go(i){if(done||i<0||i>=test.length)return;pos=i;question();window.scrollTo({top:0,behavior:'instant'});}
function submitQuiz(){if(done)return;const unanswered=answers.filter(a=>a===null).length;if(unanswered&&!confirm(`Bạn còn ${unanswered} câu chưa trả lời. Bạn vẫn muốn nộp bài?`))return;finish(false);}
function finish(expired=false){if(done)return;clearInterval(interval);done=true;const score=test.reduce((s,q,i)=>s+(answers[i]===q.key?1:0),0);const unanswered=answers.filter(a=>a===null).length,wrong=test.length-score-unanswered;app.innerHTML=`<h1>${expired?'Hết 40 phút — bài thi đã tự nộp':'Kết quả bài thi'}</h1><p><strong style="font-size:46px;color:#245fd1">${score}/${test.length}</strong> câu đúng — ${(score/test.length*100).toFixed(0)}%</p><p class="muted">Đã trả lời ${test.length-unanswered}/${test.length} câu • Sai ${wrong} câu • Chưa trả lời ${unanswered} câu</p><div class="flex"><button class="primary" onclick="start()">Làm lại — rút 50 câu mới</button><button class="primary secondary" onclick="home()">Trang chủ</button></div><h2>Xem lại đáp án</h2>${test.map((q,i)=>`<div class="review"><strong>Câu ${i+1}. ${escapeHtml(q.q)}</strong><p class="${answers[i]===q.key?'good':'bad'}">${answers[i]===null?'Chưa trả lời':`Bạn chọn ${'ABCD'[answers[i]]}. ${escapeHtml(q.a[answers[i]])}`} ${answers[i]===q.key?'✓':'✗'}</p><p class="good">Đáp án: ${'ABCD'[q.key]}. ${escapeHtml(q.a[q.key])}</p></div>`).join('')}`;window.scrollTo(0,0);}
home();</script></body></html>
